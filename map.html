<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWO Guild - 쟁탈전 배치도</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 모든 길드원에게 공유되는 저장소를 위한 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth-modal.js"></script>
    <script src="ui-utils.js"></script>
    <style>
        .map-controls {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: center;
            justify-content: center;
        }

        .map-controls label {
            white-space: nowrap;
        }

        .map-controls select, .map-controls button, .auth-btn, .save-btn {
            background: #111;
            color: #fff;
            border: 1px solid #f39c12;
            padding: 10px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .map-controls button, .save-btn {
            background-color: #f39c12;
            color: #000;
            cursor: pointer;
        }

        .save-btn {
            display: none;
        }

        body.editable-mode .save-btn {
            display: inline-block;
        }

        /* 14x14 그리드용 맵 보드 (최대 910px, 화면이 좁으면 화면 폭에 맞춰 축소) */
        #map-board {
            width: min(910px, 92vw);
            height: min(910px, 92vw);
            background: #ffffff;
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            grid-template-rows: repeat(14, 1fr);
            border: 3px solid #000;
            position: relative;
            margin: 0 auto;
            user-select: none;
        }

        .cell {
            border: 1px solid #777;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #000;
            outline: none;
            text-align: center;
            word-break: break-all;
            z-index: 1;
        }

        @media (max-width: 700px) {
            .cell {
                font-size: 0.55rem;
            }
            .shrine-center-box {
                font-size: 0.6rem !important;
            }
            .tw-in-yellow {
                font-size: 0.65rem !important;
            }
        }

        /* 중앙 6x6 노란색 영역 (14x14에서 중앙에 정확히 위치) */
        .center-yellow-zone {
            position: absolute;
            top: 28.571%;  /* 4번째 칸 위치 (4/14) */
            left: 28.571%; /* 4번째 칸 위치 (4/14) */
            width: 42.857%; /* 6칸 너비 (6/14) */
            height: 42.857%; /* 6칸 높이 (6/14) */
            background-color: #ffe066;
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        /* 중앙 신전 박스 */
        .shrine-center-box {
            width: 40%;
            height: 40%;
            background-color: #d4ac0d;
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: #000;
            line-height: 1.3;
        }

        /* 노란색 영역 내부 좌우 1칸 TW 타워 박스 */
        .tw-in-yellow {
            position: absolute;
            width: 16.66%;
            height: 16.66%;
            background-color: #00a8ff;
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            z-index: 6;
        }

        .tw-in-yellow.left {
            left: 0;
            top: 41.66%;
        }

        .tw-in-yellow.right {
            right: 0;
            top: 41.66%;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚔️ 쟁탈전 배치도 편집기</h1>
        <div class="auth-btn-area">
            <button id="save-btn" class="save-btn" onclick="saveMapData()">💾 저장하기</button>
            <button id="auth-btn" class="auth-btn" onclick="toggleAdmin()">관리자 로그인</button>
        </div>
    </header>

    <nav>
        <div class="nav-links">
            <a href="index.html">홈 (메인)</a>
            <a href="events.html">시즌 & 정기 이벤트</a>
            <a href="map.html" class="active">쟁탈전 배치도</a>
            <a href="blackmoney.html">블랙머니 전장</a>
            <a href="rally.html">집결전 스케줄러</a>
            <a href="calculator.html">육성 재료 계산기</a>
            <a href="showdown.html">연맹대결 계산기</a>
            <a href="board.html">건의함</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="container map-builder-wrapper">
            
            <div class="map-controls">
                <label style="font-weight:bold; color:#f39c12;">신전 이름:</label>
                <select id="shrine-select" onchange="updateShrineName()">
                    <option value="Lv.1 고대신전 I">Lv.1 고대신전 I</option>
                    <option value="Lv.2 고대신전 II" selected>Lv.2 고대신전 II</option>
                    <option value="Lv.3 고대신전 III">Lv.3 고대신전 III</option>
                </select>

                <label style="font-weight:bold; color:#f39c12;">배치 색상:</label>
                <select id="color-select">
                    <option value="#f39c12">주황색 (고정멤버)</option>
                    <option value="#ffb6c1">분홍색 (멤버)</option>
                    <option value="#ffffff">초기화 (흰색)</option>
                </select>

                <label style="font-weight:bold; color:#f39c12;">배치 인원:</label>
                <select id="member-select">
                    <option value="">(이름 유지 · 색상만 칠하기)</option>
                    <option value="__clear__">(이름 지우기)</option>
                </select>

                <button onclick="downloadMapImage()">💾 이미지 저장</button>
            </div>

            <p id="member-select-hint" style="display:none; text-align:center; color:#aaa; font-size:0.8rem; margin-bottom:12px;">
                💡 "배치 인원"에서 이름을 고르면, 칸을 클릭할 때 색칠과 동시에 이름도 자동으로 채워져요.
            </p>

            <!-- 14x14 그리드 맵 보드 -->
            <div id="map-board">
                <!-- 중앙 6x6 노란색 영역 -->
                <div class="center-yellow-zone">
                    <div class="tw-in-yellow left">TW</div>
                    <div class="shrine-center-box" id="shrine-display">
                        Lv.2 고대신전 II<br>
                        Lv.2 Ancient Temple II<br>
                        Lv.2 古代神殿 II
                    </div>
                    <div class="tw-in-yellow right">TW</div>
                </div>
            </div>

            <p id="edit-notice" style="margin-top: 15px; color: #888; font-size: 0.85rem; text-align: center;">
                🔒 현재 읽기 전용 상태입니다. 관리자 로그인 후 편집할 수 있습니다.
            </p>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 OWO GUILD #224. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        // 관리자 비밀번호는 Firebase에 저장되어 다른 페이지들과 항상 동일하게 유지됩니다.
        let isAdmin = false;

        const board = document.getElementById('map-board');
        const colorSelect = document.getElementById('color-select');
        const memberSelect = document.getElementById('member-select');
        const shrineSelect = document.getElementById('shrine-select');
        const shrineDisplay = document.getElementById('shrine-display');

        function populateMemberSelect() {
            getGuildMemberNames().then((names) => {
                names.forEach((name) => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    memberSelect.appendChild(opt);
                });
            });
        }

        // 14x14 셀 (총 196개) 생성
        function initBoard() {
            board.querySelectorAll('.cell').forEach(cell => cell.remove());
            for (let i = 0; i < 196; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.contentEditable = "false";
                
                cell.addEventListener('mousedown', (e) => {
                    if (isAdmin && e.target === cell) {
                        cell.style.backgroundColor = colorSelect.value;
                        if (memberSelect.value === '__clear__') {
                            cell.innerText = '';
                        } else if (memberSelect.value) {
                            cell.innerText = memberSelect.value;
                        }
                    }
                });

                board.appendChild(cell);
            }
            loadMapData();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                openLoginModal(() => {
                    isAdmin = true;
                    document.body.classList.add('editable-mode');
                    document.getElementById('auth-btn').innerText = "관리자 로그아웃";
                    document.getElementById('edit-notice').innerText = "💡 각 칸을 클릭하여 색상을 칠하거나, 닉네임을 직접 입력할 수 있습니다.";
                    enableEditing(true);
                });
            } else {
                isAdmin = false;
                document.body.classList.remove('editable-mode');
                document.getElementById('auth-btn').innerText = "관리자 로그인";
                document.getElementById('edit-notice').innerText = "🔒 현재 읽기 전용 상태입니다. 관리자 로그인 후 편집할 수 있습니다.";
                enableEditing(false);
            }
        }

        function enableEditing(enable) {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.contentEditable = enable ? "true" : "false";
            });
            shrineSelect.disabled = !enable;
            colorSelect.disabled = !enable;
            memberSelect.disabled = !enable;
            document.getElementById('member-select-hint').style.display = enable ? 'block' : 'none';
        }

        function updateShrineName() {
            const val = shrineSelect.value;
            shrineDisplay.innerHTML = `${val}<br>${val.replace('고대신전', 'Ancient Temple')}<br>${val.replace('고대신전', '古代神殿')}`;
        }

        function saveMapData() {
            const cells = document.querySelectorAll('.cell');
            const mapData = [];
            cells.forEach(cell => {
                mapData.push({
                    text: cell.innerText,
                    bg: cell.style.backgroundColor
                });
            });

            const mapState = {
                shrine: shrineSelect.value,
                cells: mapData
            };

            db.ref('map').set(mapState).then(() => {
                showToast("배치도 설정이 모든 길드원에게 저장되었습니다!");
            }).catch(err => {
                console.error(err);
                showToast("저장 중 오류가 발생했습니다. 콘솔을 확인해주세요.", 'error');
            });
        }

        // 실시간 리스너: 다른 사람이 저장하면 내 화면도 자동으로 업데이트됩니다.
        function loadMapData() {
            db.ref('map').on('value', (snapshot) => {
                const mapState = snapshot.val();
                if (mapState) {
                    if (mapState.shrine) {
                        shrineSelect.value = mapState.shrine;
                        updateShrineName();
                    }

                    const cells = document.querySelectorAll('.cell');
                    if (mapState.cells && mapState.cells.length === cells.length) {
                        cells.forEach((cell, idx) => {
                            cell.innerText = mapState.cells[idx].text;
                            cell.style.backgroundColor = mapState.cells[idx].bg;
                        });
                    }
                }
            });
        }

        function downloadMapImage() {
            html2canvas(board).then(canvas => {
                const link = document.createElement('a');
                link.download = '쟁탈전_배치도.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        window.onload = () => {
            initBoard();
            populateMemberSelect();
            enableEditing(false);
        };
    </script>
</body>
</html>
